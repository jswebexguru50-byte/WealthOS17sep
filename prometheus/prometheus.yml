global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: wealthos-data-platform
    static_configs:
      - targets:
          - host.docker.internal:3000
    metrics_path: /api/prometheus-metrics
    scrape_interval: 15s
    scrape_timeout: 10s
